/* ==========================================================
   iPhone 13 mini / compact iPhone responsive pass
   Visual design unchanged; only sizing/reflow/overflow fixes.
   Target viewport: 375 CSS px (also safe down to 320 px).
   ========================================================== */
html,body{max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
img,svg,canvas{max-width:100%}
button,input,select,textarea{max-width:100%}
.app,.page,.card,.row,.grow,.metric,.field,.asset-card,.asset-group,.entry-card,.setting-row,.trade-row,.proposal-top,.section-title,.pagehead,.top,.top-title,.top-actions{min-width:0}
.card,.metric,.asset-card,.trade-row,.entry-card{overflow-wrap:anywhere}

@media (max-width:430px){
  :root{--r:18px;--rs:13px}
  .app{width:100%;padding:calc(13px + var(--safeTop)) 11px calc(84px + var(--safeBottom))}
  .page{gap:10px}

  .top{gap:8px;margin:2px 0 0;align-items:flex-start}
  .top-title{min-width:0;flex:1}
  .top-title h1{font-size:31px;letter-spacing:-1px;line-height:1}
  .tagline{font-size:12px;letter-spacing:.045em;margin-top:4px;white-space:normal}
  .top-actions{gap:5px;flex:0 0 auto}
  .version{padding:7px 8px;border-radius:11px;font-size:9.5px;font-weight:700}
  .icon-btn{width:38px;height:38px;border-radius:11px;font-size:18px}
  .back-btn{width:30px;height:38px;font-size:27px}

  .card{padding:13px;border-radius:18px}
  .kicker{font-size:9px;letter-spacing:.13em}
  .sub{font-size:11px;line-height:1.35}
  .section-title{gap:8px;margin-bottom:10px}
  .section-title h2{font-size:17px;line-height:1.15}

  .big-num{font-size:34px;letter-spacing:-.8px}
  .proposal-num{font-size:22px;line-height:1.08;letter-spacing:-.25px}
  .num{font-weight:650}

  .row{gap:8px}
  .grid2{gap:8px}
  .grid3{grid-template-columns:1fr 1fr;gap:8px}
  .grid3>*:nth-child(3):last-child{grid-column:1/-1}
  .grid4{grid-template-columns:1fr 1fr;gap:7px}

function proposalPage(){let d=state.draft,c=draftCalc(),issues=evaluateGuardrails(d);return `${pageHead('Détails de la proposition','Analyse complète et paramètres de l’entrée.','dashboard')}<section class="card proposal-card"><div class="row between"><div><div class="kicker">PROPOSITION · RIEN N’EST APPLIQUÉ</div><div class="proposal-num" style="margin-top:9px">${money(c.margin,2)} · ${smart(c.lots,4)} lots</div></div><span class="version">${esc(state.account.label)}</span></div><div class="pill-row"><span class="pillx">♢ ${pct(c.riskPct,2)}</span><span class="pillx">▮ ${fmt(c.rr,2)}R</span><span class="pillx red">SL ${smart(d.sl,4)}</span><span class="pillx green">TP ${smart(d.tp,4)}</span></div><div class="sub" style="margin-top:8px">Risque global après : ${pct(globalRiskAfterDraft(),2)} / ${pct(state.guardrails.globalRisk.value,2)}</div></section>${mt5HTML(c,d)}<section class="card"><div class="section-title"><div><div class="kicker">DÉTAILS DU CALCUL</div><h2>Impact sur le compte</h2></div></div><div class="summary-list"><div class="summary-line"><span>Marge réellement mobilisée</span><strong>${money(c.margin,2)}</strong></div><div class="summary-line"><span>Risque au SL</span><strong class="red">${money(-c.risk,2)} (${pct(c.riskPct,2)})</strong></div><div class="summary-line"><span>Gain au TP</span><strong class="green">${money(c.reward,2)} (${pct(c.rewardPct,2)})</strong></div><div class="summary-line"><span>Ratio gain / risque</span><strong>${fmt(c.rr,2)}</strong></div><div class="summary-line"><span>Valeur / point de cette entrée</span><strong>${money(c.pv*c.lots,4)}</strong></div><div class="summary-line"><span>Risque global après</span><strong>${pct(globalRiskAfterDraft(),2)}</strong></div></div></section>${issues.length?`<div class="callout warn"><strong>${issues.length} garde-fou${issues.length>1?'s':''} signalé${issues.length>1?'s':''}</strong><br>${issues.map(i=>esc(i.text)).join('<br>')}</div>`:'<div class="callout"><strong>Cadre respecté.</strong> Rien n’est appliqué tant que tu ne valides pas.</div>'}<div class="grid2"><button class="btn" data-page="position">Modifier</button><button class="btn primary" data-action="apply-draft">＋ Appliquer au plan</button></div>`}
function planPage(){let groups=state.assets.map(a=>({a,entries:state.entries.filter(e=>e.assetId===a.id&&matchPlanFilter(e))})).filter(g=>g.entries.length||state.ui.planFilter==='all'),openN=openEntries().length,plannedN=plannedEntries().length;let riskTotal=(currentOpenRisk()+plannedEntries().reduce((s,e)=>s+riskOfEntry(e),0))/(riskCapital()||1)*100;let currentMargin=openEntries().reduce((s,e)=>s+marginPerLot(getAsset(e.assetId),e.entryPrice)*e.lots,0);let plannedMargin=plannedEntries().reduce((s,e)=>s+marginPerLot(getAsset(e.assetId),e.entryPrice)*e.lots,0);let plannedPnl=plannedEntries().reduce((s,e)=>s+entryPnl(e,pos(getAsset(e.assetId)?.currentPrice),true),0);let currentP=openPnl();return `${pageHead('Plan complet','Toutes les entrées par actif','dashboard')}<div class="plan-summary"><div class="metric"><span>Actifs suivis</span><strong>${state.assets.length}</strong></div><div class="metric"><span>Entrées ouvertes</span><strong>${openN}</strong></div><div class="metric"><span>Entrées prévues</span><strong>${plannedN}</strong></div><div class="metric"><span>Risque total</span><strong class="amber">${pct(riskTotal,2)}</strong></div></div><div class="chips"><button class="chip ${state.ui.planFilter==='all'?'active':''}" data-action="plan-filter" data-value="all">Tous</button><button class="chip ${state.ui.planFilter==='open'?'active':''}" data-action="plan-filter" data-value="open">Ouvertes</button><button class="chip ${state.ui.planFilter==='planned'?'active':''}" data-action="plan-filter" data-value="planned">Prévues</button><button class="chip ${state.ui.planFilter==='closed'?'active':''}" data-action="plan-filter" data-value="closed">Fermées</button><button class="chip" data-action="collapse-all">${state.ui.planCollapseAll?'Développer tout':'Réduire tout'}</button></div>${groups.length?groups.map(g=>assetGroupHTML(g.a,g.entries)).join(''):'<div class="callout center">Aucune entrée dans cette vue.</div>'}<section class="card"><div class="kicker">POSITION & MARGE · ACTUEL VS PLAN ACTIVÉ</div><div class="compare" style="margin-top:10px"><div><h3>Actuel</h3><div class="summary-list"><div class="summary-line"><span>P&L entrées ouvertes</span><strong class="${pnlClass(currentP)}">${money(currentP,2,true)}</strong></div><div class="summary-line"><span>Marge utilisée</span><strong>${money(currentMargin,2)}</strong></div><div class="summary-line"><span>Marge libre</span><strong>${money(Math.max(0,state.account.equity-currentMargin),2)}</strong></div></div></div><div><h3>Si les entrées prévues étaient exécutées</h3><div class="summary-list"><div class="summary-line"><span>Estimation P&L prévues</span><strong class="${pnlClass(plannedPnl)}">${money(plannedPnl,2,true)}</strong></div><div class="summary-line"><span>Estimation P&L total</span><strong class="${pnlClass(currentP+plannedPnl)}">${money(currentP+plannedPnl,2,true)}</strong></div><div class="summary-line"><span>Marge après activation</span><strong>${money(currentMargin+plannedMargin,2)}</strong></div><div class="summary-line"><span>Marge libre après</span><strong>${money(Math.max(0,state.account.equity-currentMargin-plannedMargin),2)}</strong></div></div></div></div><div class="sub" style="margin-top:8px">Simulation uniquement : les entrées prévues sont supposées exécutées à leur prix d’entrée puis valorisées au niveau actuel de chaque actif.</div></section>`}
function matchPlanFilter(e){return state.ui.planFilter==='all'||e.status===state.ui.planFilter}
function assetGroupHTML(a,entries){let collapsed=state.ui.planCollapseAll||state.ui['collapsed_'+a.id];let est=entries.reduce((s,e)=>e.status==='closed'?s+num(e.actualPnl):s+entryPnl(e,pos(a.currentPrice),true),0);return `<section class="asset-group"><div class="asset-group-head" data-action="toggle-asset-group" data-value="${a.id}">${avatarHTML(a,true)}<div class="grow"><strong>${esc(a.symbol)}</strong><div class="sub">${entries.length} entrée${entries.length>1?'s':''} · ${entries.filter(e=>e.status==='open').length} ouverte${entries.filter(e=>e.status==='open').length>1?'s':''} / ${entries.filter(e=>e.status==='planned').length} prévue${entries.filter(e=>e.status==='planned').length>1?'s':''}</div></div><div class="right"><strong class="${pnlClass(est)}">${money(est,2,true)}</strong><div class="tiny muted">Estimation du P&L</div></div><span class="cyan">${collapsed?'⌄':'⌃'}</span></div>${collapsed?'':`<div class="entry-list">${entries.map(e=>entryCardHTML(e)).join('')}</div>`}</section>`}
function entryCardHTML(e){let a=getAsset(e.assetId),level=pos(a?.currentPrice),p=e.status==='closed'?num(e.actualPnl):entryPnl(e,level,true);return `<div class="entry-card" data-action="edit-entry" data-value="${e.id}"><div class="entry-top"><div class="row"><span class="status ${e.status}">${e.status==='open'?'● Ouverte':e.status==='planned'?'◉ Prévue':'○ Fermée'}</span><span class="tiny muted">${new Date(e.createdAt||Date.now()).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</span></div><span class="${e.direction===1?'green':'red'}">${e.direction===1?'↗ Achat':'↘ Vente'}</span></div><div class="entry-metrics"><div><span>Lots</span><strong>${smart(e.lots,4)}</strong></div><div><span>Entrée</span><strong>${smart(e.entryPrice,4)}</strong></div><div><span>SL</span><strong class="red">${e.sl?smart(e.sl,4):'—'}</strong></div><div><span>TP</span><strong class="green">${e.tp?smart(e.tp,4):'—'}</strong></div><div><span>${e.status==='closed'?'P&L réalisé':'Estimation P&L'}</span><strong class="${pnlClass(p)}">${money(p,2,true)}</strong></div><div><span>Modifier</span><strong class="cyan">›</strong></div></div></div>`}
function journalPage(){let period=state.ui.journalPeriod,assetFilter=state.ui.journalAsset,stateFilter=state.ui.journalState,origin=state.ui.journalOrigin,q=state.ui.journalSearch.toLowerCase();let rows=[...state.history].filter(h=>{let [s,e]=periodBounds(period);let dt=new Date(h.closedAt||h.createdAt);return dt>=s&&dt<=e&&(assetFilter==='all'||h.assetId===assetFilter)&&(stateFilter==='all'||h.status===stateFilter)&&(origin==='all'||h.source===origin)&&(!q||((getAsset(h.assetId)?.symbol||h.asset||'')+' '+(h.notes||'')).toLowerCase().includes(q))}).sort((a,b)=>new Date(b.closedAt||b.createdAt)-new Date(a.closedAt||a.createdAt));let closed=rows.filter(h=>h.status!=='open'),pnl=closed.reduce((s,h)=>s+num(h.pnl),0),wins=closed.filter(h=>num(h.pnl)>0),losses=closed.filter(h=>num(h.pnl)<0);return `${pageHead('Journal de trading','Historique réel et manuel.','dashboard')}<div class="row" style="gap:8px;flex-wrap:wrap">${periodChips(period,'journal-period')}<select class="select" style="width:auto;min-width:150px" data-bind="journalAsset"><option value="all">Tous actifs</option>${state.assets.map(a=>`<option value="${a.id}" ${assetFilter===a.id?'selected':''}>${esc(a.symbol)}</option>`).join('')}</select></div><button class="btn primary full" data-action="manual-trade">＋ Ajouter une position</button><section class="card"><div class="kicker">RÉSUMÉ DE LA PÉRIODE ⓘ</div><div class="grid4" style="margin-top:10px"><div><div class="tiny muted">P&L RÉALISÉ</div><div class="proposal-num ${pnlClass(pnl)}">${money(pnl,2,true)}</div></div><div><div class="tiny muted">NOMBRE DE TRADES</div><div class="proposal-num">${closed.length}</div></div><div><div class="tiny muted">GAGNANTS</div><div class="proposal-num green">${wins.length}</div><div class="tiny green">${closed.length?pct(wins.length/closed.length*100,1):'—'}</div></div><div><div class="tiny muted">PERDANTS</div><div class="proposal-num red">${losses.length}</div><div class="tiny red">${closed.length?pct(losses.length/closed.length*100,1):'—'}</div></div></div></section><section class="card"><div class="section-title"><div><div class="kicker">FILTRES</div></div></div><div class="toolbar"><select class="select" data-bind="journalState"><option value="all" ${stateFilter==='all'?'selected':''}>Tous états</option><option value="closed" ${stateFilter==='closed'?'selected':''}>Fermés</option><option value="open" ${stateFilter==='open'?'selected':''}>Ouverts</option></select><select class="select" data-bind="journalOrigin"><option value="all" ${origin==='all'?'selected':''}>Toutes origines</option><option value="manual" ${origin==='manual'?'selected':''}>Manuel</option><option value="csv" ${origin==='csv'?'selected':''}>Import CSV</option><option value="plan" ${origin==='plan'?'selected':''}>Dashboard</option></select><input class="input" data-bind="journalSearch" placeholder="Rechercher..." value="${esc(state.ui.journalSearch)}"></div><div class="grid2" style="margin-top:10px"><label class="btn primary full center" style="display:grid;place-items:center"><input id="csvInput" type="file" accept=".csv,.txt,text/csv" hidden>↥ Importer CSV</label><button class="btn full" data-action="export-history">Exporter CSV</button></div></section><section><div class="kicker">HISTORIQUE DES TRADES</div>${rows.length?rows.map(tradeRowHTML).join(''):'<div class="callout center" style="margin-top:10px">Aucun trade sur cette période.</div>'}</section>`}
function tradeRowHTML(h){let a=getAsset(h.assetId)||{symbol:h.asset||'Actif',displayName:'',icon:'•'},p=num(h.pnl),dt=new Date(h.closedAt||h.createdAt||Date.now());return `<div class="trade-row" data-action="edit-history" data-value="${h.id}"><div class="asset">${avatarHTML(a,true)}<div><strong>${esc(a.symbol)}</strong><small>${dt.toLocaleString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</small></div></div><div><small>Sens</small><strong class="${h.direction===-1?'red':'green'}">${h.direction===-1?'Vente':'Achat'}</strong></div><div class="hide-mobile"><small>Lots</small><strong>${smart(h.lots,4)}</strong></div><div class="hide-mobile"><small>Origine</small><strong>${h.source==='csv'?'CSV':h.source==='plan'?'Plan':'Manuel'}</strong></div><div class="pnl ${pnlClass(p)}"><small>${h.status==='open'?'P&L latent':'P&L réalisé'}</small>${money(p,2,true)}</div><div class="cyan">›</div></div>`}
function statsPage(){let rows=filteredHistory(state.ui.statsPeriod,'all'),pnl=rows.reduce((s,h)=>s+num(h.pnl),0),wins=rows.filter(h=>num(h.pnl)>0),losses=rows.filter(h=>num(h.pnl)<0),wr=rows.length?wins.length/rows.length*100:0,avgW=wins.length?wins.reduce((s,h)=>s+num(h.pnl),0)/wins.length:0,avgL=losses.length?losses.reduce((s,h)=>s+Math.abs(num(h.pnl)),0)/losses.length:0,pf=losses.length?wins.reduce((s,h)=>s+num(h.pnl),0)/losses.reduce((s,h)=>s+Math.abs(num(h.pnl)),0):wins.length?99:0,ratio=avgL?avgW/avgL:0,best=rows.length?Math.max(...rows.map(h=>num(h.pnl))):0,worst=rows.length?Math.min(...rows.map(h=>num(h.pnl))):0,streaks=maxStreaks(rows);let byAsset={};rows.forEach(h=>{byAsset[h.assetId]=(byAsset[h.assetId]||0)+1});return `${pageHead('Statistiques','Analyse tes performances en détail.','dashboard')}${periodChips(state.ui.statsPeriod,'stats-period')}<section class="card"><div class="kicker">PERFORMANCE GLOBALE ⓘ</div><div class="proposal-num ${pnlClass(pnl)}" style="font-size:40px;margin-top:8px">${money(pnl,2,true)}</div><div class="sub">${state.account.balance?pct(pnl/state.account.balance*100,2):'—'} · Tous actifs</div><div class="grid4" style="margin-top:12px"><div class="metric"><span>Taux de réussite</span><strong>${pct(wr,1)}</strong></div><div class="metric"><span>Nombre de trades</span><strong>${rows.length}</strong></div><div class="metric"><span>Gain moyen</span><strong class="green">${money(avgW,2)}</strong></div><div class="metric"><span>Perte moyenne</span><strong class="red">-${money(avgL,2)}</strong></div></div></section><section class="card"><div class="section-title"><div><div class="kicker">ÉVOLUTION DU P&L</div></div></div><div class="chart">${statsChart(rows)}</div></section><div class="grid2"><section class="card"><div class="kicker">RÉPARTITION PAR ACTIFS</div><div class="row" style="margin-top:12px"><div class="donut"><div class="donut-label">${rows.length}<br><span class="tiny">trades</span></div></div><div class="grow summary-list">${Object.entries(byAsset).slice(0,5).map(([id,n])=>`<div class="summary-line"><span>${esc(getAsset(id)?.symbol||id)}</span><strong>${rows.length?pct(n/rows.length*100,1):'—'}</strong></div>`).join('')||'<div class="muted">Aucune donnée</div>'}</div></div></section><section class="card"><div class="kicker">TYPES DE TRADES</div><div class="bars" style="margin-top:15px"><div><div class="row between"><span>Trades gagnants</span><strong>${wins.length} (${pct(wr,1)})</strong></div><div class="bar"><i style="width:${wr}%"></i></div></div><div><div class="row between"><span>Trades perdants</span><strong>${losses.length} (${pct(100-wr,1)})</strong></div><div class="bar"><i style="width:${100-wr}%;background:var(--red)"></i></div></div></div></section></div><section class="card"><div class="kicker">INDICATEURS CLÉS</div><div class="summary-list" style="margin-top:8px"><div class="summary-line"><span>Profit factor</span><strong>${fmt(pf,2)}</strong></div><div class="summary-line"><span>Ratio gain / perte</span><strong>${fmt(ratio,2)}</strong></div><div class="summary-line"><span>Meilleur trade</span><strong class="green">${money(best,2,true)}</strong></div><div class="summary-line"><span>Pire trade</span><strong class="red">${money(worst,2,true)}</strong></div><div class="summary-line"><span>Série de gains max</span><strong>${streaks.win}</strong></div><div class="summary-line"><span>Série de pertes max</span><strong>${streaks.loss}</strong></div></div></section>`}
function statsChart(rows){let arr=[...rows].sort((a,b)=>new Date(a.closedAt)-new Date(b.closedAt));if(!arr.length)return `<div class="center muted" style="padding-top:65px">Pas encore de données sur cette période.</div>`;let cum=0,vals=arr.map(x=>(cum+=num(x.pnl))),min=Math.min(0,...vals),max=Math.max(0,...vals),span=max-min||1;let pts=vals.map((v,i)=>`${10+i*(280/Math.max(1,vals.length-1))},${150-(v-min)/span*130}`).join(' ');let zeroY=150-(0-min)/span*130;return `<svg viewBox="0 0 300 170"><line x1="8" x2="292" y1="${zeroY}" y2="${zeroY}" stroke="#34515f" stroke-dasharray="4 5"/><polyline points="${pts}" fill="none" stroke="var(--cyan)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${pts.split(' ').slice(-1)[0].split(',')[0]}" cy="${pts.split(' ').slice(-1)[0].split(',')[1]}" r="4" fill="var(--cyan)"/></svg>`}
function maxStreaks(rows){let arr=[...rows].sort((a,b)=>new Date(a.closedAt)-new Date(b.closedAt)),w=0,l=0,mw=0,ml=0;for(let h of arr){if(num(h.pnl)>0){w++;l=0;mw=Math.max(mw,w)}else if(num(h.pnl)<0){l++;w=0;ml=Math.max(ml,l)}else{w=l=0}}return{win:mw,loss:ml}}
function settingsPage(){let tab=state.ui.settingsTab;return `${pageHead('Paramètres','Personnalise ton expérience.','dashboard')}<div class="tabs">${[['account','Compte'],['assets','Actifs'],['guards','Garde-fous'],['prefs','Préférences'],['appearance','Apparence']].map(([k,l])=>`<button class="tab ${tab===k?'active':''}" data-action="settings-tab" data-value="${k}">${l}</button>`).join('')}</div>${tab==='account'?settingsAccount():tab==='assets'?settingsAssets():tab==='guards'?settingsGuards():tab==='prefs'?settingsPrefs():settingsAppearance()}`}
function settingsAccount(){return `<section class="card"><div class="section-title"><div class="row"><span class="ico">▣</span><div><div class="kicker">COMPTE & CONFIDENTIALITÉ</div><div class="sub">Tes données restent locales sur cet appareil.</div></div></div></div><div class="grid2"><div class="field"><label>Solde / balance ($)</label><input class="input" data-bind="accountBalance" value="${smart(state.account.balance,2)}"></div><div class="field"><label>Equity actuelle ($)</label><input class="input" data-bind="accountEquity" value="${smart(state.account.equity,2)}"></div><div class="field"><label>Nom du compte</label><input class="input" data-bind="accountLabel" value="${esc(state.account.label)}"></div><div></div></div><div class="setting-row"><div><strong>Masquer le P&L</strong><small>Cache les gains/pertes réalisés sur le Dashboard.</small></div><button class="switch ${state.ui.hidePnl?'on':''}" data-action="toggle-hide-pnl"></button></div><div class="setting-row"><div><strong>Masquer le solde</strong><small>Cache uniquement le solde affiché.</small></div><button class="switch ${state.ui.hideBalance?'on':''}" data-action="toggle-hide-balance"></button></div></section><section class="card"><div class="row"><span class="ico">♙</span><div><div class="kicker">PROFIL</div><div class="sub">Utilisé uniquement pour personnaliser les messages.</div></div></div><div class="grid2" style="margin-top:12px"><div class="field"><label>Prénom / surnom</label><input class="input" data-bind="profileName" value="${esc(state.profile.name)}" placeholder="Ex. Fayrouz"></div><div class="field"><label>Accords</label><select class="select" data-bind="profileGrammar"><option value="neutral" ${state.profile.grammar==='neutral'?'selected':''}>Neutre</option><option value="feminine" ${state.profile.grammar==='feminine'?'selected':''}>Féminin</option><option value="masculine" ${state.profile.grammar==='masculine'?'selected':''}>Masculin</option></select></div></div></section><section clas function handleAction(a,v,el,evt){if(a==='toast-close'){state.toast=null;renderToastOnly();return}if(a==='toggle-pnl'){state.ui.hidePnl=!state.ui.hidePnl;save();render();return}if(a==='set-dashboard-period'){state.ui.dashboardPeriod=v;save();render();return}if(a==='set-journal-period'){state.ui.journalPeriod=v;save();render();return}if(a==='set-stats-period'){state.ui.statsPeriod=v;save();render();return}if(a==='swap-converter'){state.converter.mode=state.converter.mode==='margin'?'lots':'margin';save();render();return}if(a==='draft-status'){state.draft.status=v;save();render();return}if(a==='draft-direction'){state.draft.direction=+v;updateTpFromR();save();render();return}if(a==='risk-preset'){state.draft.riskPct=+v;save();render();return}if(a==='r-preset'){state.draft.r=+v;updateTpFromR();save();render();return}if(a==='size-from-risk'){state.draft.mode='risk';syncDraft();save();render();return}if(a==='tp-auto'){updateTpFromR();save();render();return}if(a==='toggle-guard-detail'){state.ui.guardDetailOpen=!state.ui.guardDetailOpen;save();render();return}if(a==='copy-mt5'){copyMT5();return}if(a==='apply-draft'){applyDraft();return}if(a==='plan-filter'){state.ui.planFilter=v;save();render();return}if(a==='collapse-all'){state.ui.planCollapseAll=!state.ui.planCollapseAll;save();render();return}if(a==='toggle-asset-group'){state.ui['collapsed_'+v]=!state.ui['collapsed_'+v];save();render();return}if(a==='edit-entry'){state.modal={type:'entry',entryId:v};render();return}if(a==='manual-trade'){state.modal={type:'history',historyId:null,manual:true};render();return}if(a==='edit-history'){state.modal={type:'history',historyId:v};render();return}if(a==='export-history'){exportHistory();return}if(a==='settings-tab'){state.ui.settingsTab=v;save();render();return}if(a==='open-guards'){state.ui.settingsTab='guards';page('settings');return}if(a==='guard-master'){state.guardrails.enabled=!state.guardrails.enabled;save();render();return}if(a==='guard-toggle'){state.guardrails[v].enabled=!state.guardrails[v].enabled;save();render();return}if(a==='behavior-toggle'){let r=state.guardrails.behavioral.find(x=>x.id===v);if(r)r.enabled=!r.enabled;save();render();return}if(a==='add-behavior'){state.modal={type:'textprompt',kind:'behavior',title:'Ajouter une règle',label:'Règle comportementale'};render();return}if(a==='toggle-hide-pnl'){state.ui.hidePnl=!state.ui.hidePnl;save();render();return}if(a==='toggle-hide-balance'){state.ui.hideBalance=!state.ui.hideBalance;save();render();return}if(a==='toggle-rewards'){state.profile.rewards=!state.profile.rewards;save();render();return}if(a==='voice-test'){voice(Math.random()>.5?'reward':'warning');return}if(a==='add-phrase'){state.modal={type:'textprompt',kind:'phrase',title:'Ajouter une phrase',label:'Phrase',category:true};render();return}if(a==='delete-phrase'){state.profile.customPhrases=state.profile.customPhrases.filter(x=>x.id!==v);save();render();return}if(a==='export-backup'){exportBackup();return}if(a==='reset-app'){if(confirm('Réinitialiser toutes les données locales de Dashboard ?')){localStorage.removeItem(STORAGE);state=defaults();render()}return}if(a==='asset-cat'){state.ui.assetCategory=v;state.ui.assetSearch='';save();render();return}if(a==='catalog-asset'){let x=CATALOG.find(x=>x.key===v);let existing=state.assets.find(y=>y.symbol===x.symbol);if(existing){state.ui.selectedAssetId=existing.id;state.draft.assetId=existing.id;save();setToast(`${existing.symbol} est déjà dans tes actifs.`);page('dashboard');return}state.assetEdit=templateFromCatalog(x);state.ui.assetParamsOpen=false;save();render();return}if(a==='custom-asset'){state.assetEdit={id:'',name:'',displayName:'',symbol:'',category:state.ui.assetCategory,type:'CFD',icon:'+',imageData:'',verified:false,quoteCurrency:'USD',profitCurrency:'USD',marginCurrency:'USD',decimals:2,contractSize:0,profitToUsd:1,marginToUsd:1,pointValueMode:'formula',pointValueManual:0,marginMode:'formula',leverage:0,marginPerLotManual:0,lotMin:.01,lotMax:100,lotStep:.01,currentPrice:0,autoStopPct:0,spreadPoints:0,commissionMode:'fixed',commissionValue:0,timezone:'UTC'};state.ui.assetParamsOpen=true;save();render();return}if(a==='save-asset'){saveAssetEdit();return}if(a==='edit-asset'){let x=getAsset(v);state.assetEdit=clone(x);state.ui.assetCategory=x.category;state.ui.assetParamsOpen=true;page('addAsset');return}if(a==='modal-close'||a==='modal-bg'){if(a==='modal-bg'&&evt&&el!==evt.target)return;state.modal=null;render();return}if(a==='save-entry-modal'){saveEntryModal(v);return}if(a==='delete-entry'){if(confirm('Supprimer cette entrée du plan ?')){state.entries=state.entries.filter(x=>x.id!==v);state.modal=null;save();render()}return}if(a==='save-history-modal'){saveHistoryModal(v);return}if(a==='delete-history'){if(confirm('Supprimer ce trade de l’historique ?')){state.history=state.history.filter(x=>x.id!==v);state.modal=null;save();render()}return}if(a==='confirm-import'){confirmImport();return}if(a==='prompt-save'){savePrompt(el.dataset.kind);return}if(a==='toggle-risk-helper'){if(evt)evt.preventDefault();state.draft.riskHelperOpen=!state.draft.riskHelperOpen;save();render();return}if(a==='toggle-asset-params'){if(evt)evt.preventDefault();state.ui.assetParamsOpen=!state.ui.assetParamsOpen;save();render();return}if(a==='noop')return}
function handleInput(t){if(t.dataset.bind){let k=t.dataset.bind,val=t.value;if(k==='assetSearch'){state.ui.assetSearch=val;save();render();return}if(k==='journalSearch'){state.ui.journalSearch=val;save();render();return}if(k==='converterMargin'){state.converter.margin=pos(val);state.converter.mode='margin';save();render();return}if(k==='converterLots'){state.converter.lots=pos(val);state.converter.mode='lots';save();render();return}if(k==='assetCurrentPrice'){let a=asset();a.currentPrice=pos(val);save();return}if(k==='draftEntry'){state.draft.entryPrice=pos(val);save();return}if(k==='draftMargin'){state.draft.margin=pos(val);state.draft.mode='margin';syncDraft();save();render();return}if(k==='draftLots'){state.draft.lots=pos(val);state.draft.mode='lots';syncDraft();save();render();return}if(k==='draftSl'){state.draft.sl=pos(val);save();render();return}if(k==='draftTp'){state.draft.tp=pos(val);syncRFromTp();save();render();return}if(k==='draftRiskPct'){state.draft.riskPct=pos(val);save();return}if(k==='draftR'){state.draft.r=pos(val);save();return}if(k==='accountBalance'){state.account.balance=pos(val);save();return}if(k==='accountEquity'){state.account.equity=pos(val);state.account.equityLinked=false;save();return}if(k==='accountLabel'){state.account.label=val;save();return}if(k==='profileName'){state.profile.name=val;save();return}if(k==='voiceInsolence'){state.profile.voiceInsolence=+val;save();return}}
 if(t.dataset.guardValue){state.guardrails[t.dataset.guardValue].value=pos(t.value);save();return}if(t.dataset.assetField&&state.assetEdit){let k=t.dataset.assetField;if(['name','displayName','symbol','category','type','profitCurrency','marginCurrency','timezone'].includes(k))state.assetEdit[k]=t.value;else state.assetEdit[k]=pos(t.value);save();return}if(t.dataset.modalField&&state.modal){state.modal.values=state.modal.values||{};state.modal.values[t.dataset.modalField]=t.value;return}if(t.dataset.importMap&&state.importPending){state.importPending.map[t.dataset.importMap]=t.value;save();return}}
function handleChange(t){if(t.dataset.bind){let k=t.dataset.bind;if(k==='selectedAsset'){selectAsset(t.value);return}if(k==='draftAsset'){selectDraftAsset(t.value);return}if(k==='journalAsset'){state.ui.journalAsset=t.value;save();render();return}if(k==='journalState'){state.ui.journalState=t.value;save();render();return}if(k==='journalOrigin'){state.ui.journalOrigin=t.value;save();render();return}if(k==='profileGrammar'){state.profile.grammar=t.value;save();return}if(k==='voiceFrequency'){state.profile.voiceFrequency=t.value;save();return}if(k==='voiceStyle'){state.profile.voiceStyle=t.value;save();return}}if(t.dataset.assetField&&state.assetEdit){let k=t.dataset.assetField;state.assetEdit[k]=t.value;save();return}if(t.dataset.modalField&&state.modal){state.modal.values=state.modal.values||{};state.modal.values[t.dataset.modalField]=t.value;return}if(t.dataset.importMap&&state.importPending){state.importPending.map[t.dataset.importMap]=t.value;save();return}if(t.dataset.behaviorCheck){state.draft.behaviorChecks[t.dataset.behaviorCheck]=t.checked;save();return}}
function selectAsset(id){let a=getAsset(id);if(!a)return;state.ui.selectedAssetId=id;state.draft=blankDraft(id,pos(a.currentPrice));state.converter={margin:1000,lots:0,mode:'margin'};save();render()}
function selectDraftAsset(id){let a=getAsset(id);if(!a)return;state.draft=blankDraft(id,pos(a.currentPrice));state.ui.selectedAssetId=id;save();render()}
function updateTpFromR(){let d=state.draft,price=pos(d.entryPrice),sl=pos(d.sl),dist=Math.abs(price-sl),r=pos(d.r);if(!price||!sl||!dist||!r)return;d.tp=d.direction===1?price+dist*r:price-dist*r;syncDraft()}
function syncRFromTp(){let d=state.draft,dist=Math.abs(pos(d.entryPrice)-pos(d.sl));if(dist)d.r=Math.abs(pos(d.tp)-pos(d.entryPrice))/dist}
function copyMT5(){let c=draftCalc(),d=state.draft,txt=`Type: ${d.direction===1?'Achat':'Vente'}\nPrix: ${c.price}\nLots: ${c.lots}\nMontant exact: ${c.margin.toFixed(2)} $\nSL: ${d.sl}\nTP: ${d.tp}`;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt).then(()=>setToast('Paramètres MT5 copiés.','good')).catch(()=>setToast(txt));else setToast(txt)}
function applyDraft(){syncDraft();let c=draftCalc(),d=state.draft;if(!c.price||!c.lots){setToast('Renseigne un prix et une taille avant d’ajouter.','warn');return}let issues=evaluateGuardrails(d);let e={id:uid('entry'),assetId:d.assetId,status:d.status||'planned',direction:d.direction,entryPrice:c.price,lots:c.lots,sl:pos(d.sl)||null,tp:pos(d.tp)||null,createdAt:new Date().toISOString(),openedAt:d.status==='open'?new Date().toISOString():null,closedAt:null,exitPrice:null,actualPnl:0,notes:d.notes||'',behaviorChecks:{...d.behaviorChecks}};state.entries.push(e);save();if(issues.length>=2)voice('warning');else if(state.profile.rewards)voice('reward');setToast(issues.length?`Entrée ajoutée. ${issues.length} garde-fou${issues.length>1?'s':''} signalé${issues.length>1?'s':''}.`:'Entrée ajoutée au plan.','good');let a=getAsset(d.assetId);state.draft=blankDraft(a.id,pos(a.currentPrice));state.ui.page='dashboard';save();render()}
function saveEntryModal(id){let e=state.entries.find(x=>x.id===id);if(!e)return;let v=state.modal.values||{};let oldStatus=e.status;e.status=v.status||e.status;e.direction=v.direction?+v.direction:e.direction;e.entryPrice=v.entryPrice!==undefined?pos(v.entryPrice):e.entryPrice;e.lots=v.lots!==undefined?pos(v.lots):e.lots;e.sl=v.sl!==undefined?(pos(v.sl)||null):e.sl;e.tp=v.tp!==undefined?(pos(v.tp)||null):e.tp;e.exitPrice=v.exitPrice!==undefined?(pos(v.exitPrice)||null):e.exitPrice;e.actualPnl=v.actualPnl!==undefined?num(v.actualPnl):e.actualPnl;if(e.status==='open'&&!e.openedAt)e.openedAt=new Date().toISOString();if(e.status==='closed'){e.closedAt=e.closedAt||new Date().toISOString();if(!e.actualPnl&&e.exitPrice)e.actualPnl=entryPnl(e,e.exitPrice,true);upsertHistoryFromEntry(e);if(e.actualPnl>0&&state.profile.rewards)voice('win');else if(e.actualPnl<0)voice('loss');if(consecutiveLossesToday()>=pos(state.guardrails.pauseAfterLosses.value))voice('pause')}state.modal=null;save();render()}
function upsertHistoryFromEntry(e){let h=state.history.find(x=>x.entryId===e.id);let data={id:h?.id||uid('h'),entryId:e.id,assetId:e.assetId,direction:e.direction,entryPrice:e.entryPrice,exitPrice:e.exitPrice,lots:e.lots,closedAt:e.closedAt||new Date().toISOString(),pnl:e.actualPnl||entryPnl(e,e.exitPrice,true),source:'plan',status:'closed',notes:e.notes||''};if(h)Object.assign(h,data);else state.history.push(data)}
function saveHistoryModal(id){let h=id?state.history.find(x=>x.id===id):null,v=state.modal.values||{};let assetId=v.assetId||h?.assetId||state.ui.selectedAssetId,dir=v.direction?+v.direction:(h?.direction??1),entry=v.entryPrice!==undefined?pos(v.entryPrice):pos(h?.entryPrice),exit=v.exitPrice!==undefined?pos(v.exitPrice):pos(h?.exitPrice),lots=v.lots!==undefined?pos(v.lots):pos(h?.lots),status=v.status||h?.status||'closed',p=v.pnl!==undefined&&String(v.pnl).trim()!==''?num(v.pnl):0;if(!p&&entry&&exit&&lots){let temp={assetId,direction:dir,entryPrice:entry,lots};p=entryPnl(temp,exit,true)}let data={id:h?.id||uid('h'),assetId,direction:dir,entryPrice:entry||null,exitPrice:exit||null,lots:lots||null,closedAt:v.closedAt?new Date(v.closedAt).toISOString():(h?.closedAt||new Date().toISOString()),pnl:p,source:h?.source||'manual',status,notes:v.notes??h?.notes??''};if(h)Object.assign(h,data);else state.history.push(data);state.modal=null;save();if(status==='closed'){if(p>0&&state.profile.rewards)voice('win');else if(p<0)voice('loss');if(consecutiveLossesToday()>=pos(state.guardrails.pauseAfterLosses.value))voice('pause')}render()}
function toLocalInput(iso){let d=new Date(iso);let z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`}
function saveAssetEdit(){let e=state.assetEdit;if(!e)return;let essential=!!e.symbol&&pos(e.contractSize)>0&&pos(e.lotMin)>0&&pos(e.lotStep)>0&&(pos(e.leverage)>0||pos(e.marginPerLotManual)>0);if(!essential){setToast('Il manque un paramètre essentiel : symbole, contrat, lots/pas, et levier ou marge/lot.','warn');state.ui.assetParamsOpen=true;render();return}let existing=e.id?state.assets.find(a=>a.id===e.id):null;if(existing)Object.assign(existing,normalizeAsset(e));else{e.id=uid('asset');state.assets.push(normalizeAsset(e))}state.ui.selectedAssetId=e.id;state.assetEdit=null;state.ui.assetParamsOpen=false;save();setToast('Actif enregistré. Les calculs utilisent maintenant ses propres paramètres.','good');page('settings')}
function handleAssetPhoto(ev){let file=ev.target.files?.[0];if(!file||!state.assetEdit)return;let rd=new FileReader();rd.onload=()=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas');c.width=c.height=128;let ctx=c.getContext('2d');let s=Math.min(img.width,img.height),sx=(img.width-s)/2,sy=(img.height-s)/2;ctx.drawImage(img,sx,sy,s,s,0,0,128,128);state.assetEdit.imageData=c.toDataURL('image/jpeg',.78);save();render()};img.src=rd.result};rd.readAsDataURL(file)}
function exportBackup(){let blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'});download(blob,'dashboard-backup-'+new Date().toISOString().slice(0,10)+'.json')}
function restoreBackup(ev){let f=ev.target.files?.[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let x=JSON.parse(rd.result);let s=x.state||x;if(!s||typeof s!=='object')throw Error();localStorage.setItem(STORAGE,JSON.stringify({...s,version:2}));state=load();setToast('Sauvegarde restaurée.','good');render()}catch(e){setToast('Fichier de sauvegarde invalide.','warn')}};rd.readAsText(f)}
function exportHistory(){let rows=[['Date','Actif','Sens','Entrée','Sortie','Lots','P&L','Origine']];state.history.forEach(h=>{let a=getAsset(h.assetId);rows.push([h.closedAt,a?.symbol||'',h.direction===-1?'Vente':'Achat',h.entryPrice||'',h.exitPrice||'',h.lots||'',h.pnl||0,h.source||''])});let csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),'dashboard-historique.csv')}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function parseCSV(text){let delim=(text.split(/\r?\n/)[0].match(/;/g)||[]).length>(text.split(/\r?\n/)[0].match(/,/g)||[]).length?';':',';let rows=[],row=[],field='',q=false;for(let i=0;i<text.length;i++){let ch=text[i];if(ch==='"'){if(q&&text[i+1]==='"'){field+='"';i++}else q=!q}else if(ch===delim&&!q){row.push(field);field=''}else if((ch==='\n'||ch==='\r')&&!q){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(field);field='';if(row.some(x=>String(x).trim()))rows.push(row);row=[]}else field+=ch}row.push(field);if(row.some(x=>String(x).trim()))rows.push(row);if(!rows.length)return{headers:[],rows:[]};let headers=rows[0].map((h,i)=>String(h).trim()||'Colonne '+(i+1));return{headers,rows:rows.slice(1).map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]??''])))}}
function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function detectHeader(headers,terms){for(let t of terms){let h=headers.find(x=>norm(x).includes(norm(t)));if(h)return h}return ''}
function handleCsvFile(ev){let f=ev.target.files?.[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{let p=parseCSV(String(rd.result||''));if(!p.headers.length){setToast('CSV illisible.','warn');return}state.importPending={...p,map:{date:detectHeader(p.headers,['date de fermeture','heure de fermeture','close time','closed at','date']),pnl:detectHeader(p.headers,['profit/perte ($)','profit/loss','net profit','p&l','pnl','profit']),asset:detectHeader(p.headers,['instrument','symbol','asset','market','actif']),broker:detectHeader(p.headers,['position id','trade id','ticket','id']),entry:detectHeader(p.headers,['open rate','open price','entry price','prix ouverture']),exit:detectHeader(p.headers,['close rate','close price','exit price','prix fermeture']),lots:detectHeader(p.headers,['units','lots','volume','taille']),direction:detectHeader(p.headers,['type','direction','side'])}};state.modal={type:'csvmap'};save();render()};rd.readAsText(f)}
function parseMaybeDate(v){if(!v)return new Date();let d=new Date(v);if(Number.isFinite(d.getTime()))return d;let m=String(v).match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})(?:\s+(\d{1,2}):(\d{2}))?/);if(m){let y=+m[3];if(y<100)y+=2000;return new Date(y,+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0))}return new Date()}
function parseNumLocale(v){let s=String(v??'').trim().replace(/\s/g,'');if(s.includes(',')&&s.includes('.')){if(s.lastIndexOf(',')>s.lastIndexOf('.'))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'')}else s=s.replace(',','.');return num(s)}
function confirmImport(){let p=state.importPending,m=p.map;if(!m.date||!m.pnl){setToast('Choisis au minimum la date et le P&L.','warn');return}let added=0,dups=0;for(let r of p.rows){let assetText=m.asset?String(r[m.asset]||'').trim():'',a=state.assets.find(x=>norm(x.symbol)===norm(assetText)||norm(x.name)===norm(assetText));if(!a&&assetText){a={...templateFromCatalog({name:assetText,display:assetText,symbol:assetText,cat:'other',icon:'•'}),id:uid('asset'),verified:false,contractSize:1,leverage:1};state.assets.push(a)}a=a||asset();let date=parseMaybeDate(r[m.date]).toISOString(),pnl=parseNumLocale(r[m.pnl]),broker=m.broker?String(r[m.broker]||''):'',entry=m.entry?parseNumLocale(r[m.entry]):0,exit=m.exit?parseNumLocale(r[m.exit]):0,lots=m.lots?parseNumLocale(r[m.lots]):0,dir=m.direction?(/sell|vente|short/i.test(String(r[m.direction]))?-1:1):1,key=broker||[date,a.id,pnl,entry,exit,lots].join('|');if(state.history.some(h=>h.importKey===key)){dups++;continue}state.history.push({id:uid('h'),assetId:a.id,direction:dir,entryPrice:entry||null,exitPrice:exit||null,lots:lots||null,closedAt:date,pnl,source:'csv',status:'closed',brokerId:broker,importKey:key});added++}state.importPending=null;state.modal=null;save();setToast(`${added} trade${added>1?'s':''} importé${added>1?'s':''}${dups?` · ${dups} doublon${dups>1?'s':''} ignoré${dups>1?'s':''}`:''}.`,'good');render()}
function savePrompt(kind){let txt=document.getElementById('promptText')?.value.trim();if(!txt)return;if(kind==='behavior')state.guardrails.behavioral.push({id:uid('b'),text:txt,enabled:true});else if(kind==='phrase'){let cat=document.getElementById('promptCategory')?.value||'any';state.profile.customPhrases.push({id:uid('p'),text:txt,category:cat,enabled:true})}state.modal=null;save();render()}
// initial sync
syncDraft();save();render();setTimeout(()=>{if(!sessionStorage.getItem('dashboard-greeted')){sessionStorage.setItem('dashboard-greeted','1');voice('greeting')}},800);
})();
